    flex-wrap: wrap;
  }
  .filters-label {
    font-size: 11px; font-weight: 600;
    color: var(--sage); letter-spacing: 0.8px;
    text-transform: uppercase; margin-right: 4px;
  }
  .filter-btn {

    border-radius: 24px;
    background: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 600;
    color: var(--text-light);
    transition: all 0.25s;
    white-space: nowrap;
  }
  .filter-btn:hover {
    border-color: var(--forest);
    color: var(--forest);
  }
  .filter-btn.active {
    background: var(--forest);
    color: var(--cream);
    border-color: var(--forest);
  }
  .filter-btn.vegan-filter {
    border-color: rgba(74, 140, 92, 0.3);

  }
  .filter-btn.vegan-filter.active {
    background: var(--leaf);
    color: white;
    border-color: var(--leaf);

    max-width: 1100px; margin: 20px auto 0;
    padding: 0 40px;
    font-size: 12px; color: var(--sage);
  }

  .cards-section {
    max-width: 1100px; margin: 16px auto 0;
    padding: 0 40px 60px;
  }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }

  /* ── CARD ── */
  .card {
    background: white; border-radius: 14px;
    padding: 22px;
    border: 1px solid rgba(42, 42, 40, 0.06);
    transition: all 0.35s ease;
    position: relative; overflow: hidden;
    text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
    opacity: 0; transform: translateY(16px);
    animation: cardIn 0.4s ease both;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, var(--leaf), var(--gold));
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.4s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(26, 58, 42, 0.1);
    border-color: rgba(74, 140, 92, 0.15);
  }
  .card:hover::before { transform: scaleX(1); }
  .card.hidden { display: none; }
  .card-closed-badge {
    align-self: flex-start;
    background: var(--terracotta); color: white;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;

    margin-bottom: 8px;

    margin-bottom: 6px;
  }
  .card-logo {
    width: 64px; height: 64px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    border: 1px solid rgba(42, 42, 40, 0.08);
    background: white;

  .card-rating-num {
    font-family: 'Fraunces', serif;
    font-size: 14px; font-weight: 700; color: var(--forest);

  .card-type {
    font-size: 10px; font-weight: 600;
    color: var(--terracotta);
    letter-spacing: 0.5px; text-transform: uppercase;
    margin-bottom: 2px;

  .card-name {
    font-family: 'Fraunces', serif;
    font-size: 18px; font-weight: 700;
    color: var(--forest); margin-bottom: 2px;
  }
  .card-location {
    font-size: 12px; color: var(--sage); margin-bottom: 8px;
  }
  .card-desc {
    font-size: 13px; line-height: 1.6;

// ── STATE ──
let currentSort = 'alpha';

// ── STAR RENDERER ──
function createStar(type) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", "star-icon");
  const d = "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z";
  if (type === 'full') {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); p.setAttribute("fill", "var(--star)"); svg.appendChild(p);
  } else if (type === 'half') {
    const id = "h" + Math.random().toString(36).substr(2,5);
    svg.innerHTML = `<defs><clipPath id="${id}"><rect x="0" y="0" width="12" height="24"/></clipPath></defs>
      <path d="${d}" fill="var(--star-empty)"/>
      <path d="${d}" fill="var(--star)" clip-path="url(#${id})"/>`;
  } else {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); p.setAttribute("fill", "var(--star-empty)"); svg.appendChild(p);
  }
  return svg;
}

function starsHTML(rating) {
  const full = Math.floor(rating);
  const hasHalf = (rating % 1) >= 0.25 && (rating % 1) < 0.75;
  const extra = (rating % 1) >= 0.75 ? 1 : 0;
  const id = "h" + Math.random().toString(36).substr(2,5);
  const d = "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z";
  let html = '';
  const fullStar = `<svg viewBox="0 0 24 24" class="star-icon"><path d="${d}" fill="var(--star)"/></svg>`;
  const emptyStar = `<svg viewBox="0 0 24 24" class="star-icon"><path d="${d}" fill="var(--star-empty)"/></svg>`;
  const halfStar = `<svg viewBox="0 0 24 24" class="star-icon"><defs><clipPath id="${id}"><rect x="0" y="0" width="12" height="24"/></clipPath></defs><path d="${d}" fill="var(--star-empty)"/><path d="${d}" fill="var(--star)" clip-path="url(#${id})"/></svg>`;
  for (let i = 0; i < full + extra; i++) html += fullStar;
  if (hasHalf) html += halfStar;
  const rem = 5 - (full + extra) - (hasHalf ? 1 : 0);
  for (let i = 0; i < rem; i++) html += emptyStar;
  return html;
}

function translateTag(tag, lang) {
  if (lang === 'pt' && tagMap[tag]) return tagMap[tag];
  return tag;
}

// ── RENDER ──
function renderCards() {
  let list = [...venues];

  // Filter
  if (veganOnly) list = list.filter(v => v.vegan);

  // Sort
  if (currentSort === 'alpha') list.sort((a, b) => a.name.localeCompare(b.name));
  else if (currentSort === 'rating') list.sort((a, b) => b.rating - a.rating || b.votes - a.votes);
  else if (currentSort === 'popular') list.sort((a, b) => b.votes - a.votes);

  const grid = document.getElementById('cardsGrid');
  const noRes = document.getElementById('noResults');
  const info = document.getElementById('resultsInfo');

  if (list.length === 0) {
    grid.innerHTML = '';
    noRes.style.display = 'block';
    info.textContent = '';
    return;
  }
  noRes.style.display = 'none';

  const votesWord = currentLang === 'pt' ? 'votos' : 'votes';
  const venuesWord = currentLang === 'pt' ? 'locais' : 'venues';
  const showingWord = currentLang === 'pt' ? 'Exibindo' : 'Showing';
  info.textContent = `${showingWord} ${list.length} ${venuesWord}`;
  document.getElementById('venueCount').textContent = list.length;

  grid.innerHTML = list.map((v, i) => `
    <div class="card" style="animation-delay:${i * 0.04}s">
      <div class="card-top">
        <div class="card-logo"><img src="${v.logo}" alt="${v.name} logo" width="64" height="64" loading="lazy"></div>
        <div class="card-rating">
          <div class="card-stars">${starsHTML(v.rating)}</div>
          <span class="card-rating-num">${v.rating}</span>
        </div>
      </div>
      ${v.closed ? `<div class="card-closed-badge">${currentLang === 'pt' ? 'Encerrado' : 'Closed'}</div>` : ''}
      <div class="card-type">${v.type[currentLang]}</div>
      <div class="card-name">${v.name}</div>
      <div class="card-location">📍 ${v.location}</div>
      <div class="card-desc">${v.desc[currentLang]}</div>
      <div class="card-tags">${v.tags.map(t => `<span class="tag">${translateTag(t, currentLang)}</span>`).join('')}</div>
      <div class="card-bottom">
        <div class="card-votes"><span>${v.votes.toLocaleString()}</span> ${votesWord}</div>
        <a href="${v.url}" class="card-btn">${currentLang === 'pt' ? 'Saiba mais' : 'Learn more'}</a>
      </div>
    </div>
  `).join('');
}

// ── SORT ──
function setSort(type) {
  currentSort = type;
  document.querySelectorAll('.filter-btn[data-sort]').forEach(b => b.classList.remove('active'));
  document.querySelector(`.filter-btn[data-sort="${type}"]`).classList.add('active');
  renderCards();
}

function toggleVegan() {
  veganOnly = !veganOnly;
  document.querySelector('.vegan-filter').classList.toggle('active', veganOnly);
  renderCards();
}

  });

// ── LOAD RATINGS FROM bvg_data.json ──
function applyRatingsFromJSON() {
  fetch('bvg_data.json')
    .then(res => res.json())
    .then(data => {
      const bySlug = {};
      data.forEach(v => { bySlug[v.slug] = v; });
      venues.forEach(v => {
        const match = v.slug && bySlug[v.slug];
        if (match && typeof match.final_rating === 'number' && match.final_rating > 0) {
          v.rating = match.final_rating;
        }
      });
    })
    .catch(err => {
      console.warn('bvg_data.json not loaded — using built-in ratings. Deploy to GitHub Pages for live data.', err);
    })
    .finally(renderCards);
}

// ── INIT ──
applyRatingsFromJSON();
