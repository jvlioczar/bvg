  /* ── PAGE HEADER ── */
  .page-header {
    max-width: 1100px; margin: 0 auto;
    padding: 90px 40px 0;
  }
  .page-num {

    font-size: 64px; font-weight: 700;

    margin-bottom: -10px;
  }
  .page-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 700; color: var(--forest);
    letter-spacing: -1.5px; margin-bottom: 4px;
  }
  .page-tagline {

    font-size: 14px; font-weight: 400;
    color: var(--sage); letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .page-desc {
    font-size: 15px; line-height: 1.7;
    color: var(--text-light); max-width: 600px;
  }
  .page-count {
    margin-top: 10px;
    font-size: 13px; color: var(--sage); font-weight: 500;
  }
  .page-count span {
    font-family: 'Fraunces', serif; font-weight: 700;
    font-size: 15px; color: var(--forest);
  }

  /* ── FILTERS ── */
  .filters-bar {
    max-width: 1100px; margin: 24px auto 0;
    padding: 0 40px;
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .filters-label {
    font-size: 11px; font-weight: 600;
    color: var(--sage); letter-spacing: 0.8px;
    text-transform: uppercase; margin-right: 4px;
  }
  .filter-btn {
    padding: 7px 18px;
    border: 1.5px solid rgba(26, 58, 42, 0.12);
    border-radius: 24px;
    background: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 600;
    color: var(--text-light);
    transition: all 0.25s;
    white-space: nowrap;
  }
  .filter-btn:hover {
    border-color: var(--forest); color: var(--forest);
  }
  .filter-btn.active {
    background: var(--forest); color: var(--cream);
    border-color: var(--forest);
  }

  /* ── RESULTS ── */
  .results-info {
    max-width: 1100px; margin: 20px auto 0;
    padding: 0 40px;
    font-size: 12px; color: var(--sage);
  }

  /* ── CARDS ── */
  .cards-section {
    max-width: 1100px; margin: 16px auto 0;
    padding: 0 40px 60px;
  }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .card {
    background: white; border-radius: 14px;
    padding: 22px;
    border: 1px solid rgba(42, 42, 40, 0.06);
    transition: all 0.35s ease;
    position: relative; overflow: hidden;
    text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
    opacity: 0; transform: translateY(16px);
    animation: cardIn 0.4s ease both;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, var(--leaf), var(--gold));
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.4s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(26, 58, 42, 0.1);
    border-color: rgba(74, 140, 92, 0.15);
  }
  .card:hover::before { transform: scaleX(1); }

  .card-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 6px;
  }
  .card-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: linear-gradient(135deg, var(--leaf-light), var(--teal));
    display: flex; align-items: center; justify-content: center;
    color: var(--cream);
    font-family: 'Fraunces', serif;
    font-size: 24px; font-weight: 700;
    overflow: hidden; flex-shrink: 0;
    border: 2px solid rgba(245, 240, 232, 0.6);
    box-shadow: 0 2px 8px rgba(26, 58, 42, 0.08);
  }
  .card-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .card-logo {
    width: 64px; height: 64px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    border: 1px solid rgba(42, 42, 40, 0.08);
    background: white;
  }
  .card-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-category-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.4px; text-transform: uppercase;
  }
  .badge-activism { background: rgba(196, 113, 74, 0.1); color: var(--terracotta); }
  .badge-guide { background: rgba(58, 158, 143, 0.1); color: var(--teal); }
  .badge-meeting { background: rgba(212, 168, 71, 0.1); color: var(--bark); }
  .badge-sanctuary { background: rgba(139, 115, 85, 0.1); color: var(--bark); }

  .card-type {
    font-size: 10px; font-weight: 600;
    color: var(--terracotta);
    letter-spacing: 0.5px; text-transform: uppercase;
    margin-bottom: 2px;

    font-size: 18px; font-weight: 700;

    font-size: 13px; line-height: 1.6;
    color: var(--text-light); margin-bottom: 12px;

    padding: 3px 10px;
    background: rgba(74, 140, 92, 0.08);
    color: var(--moss);
    font-size: 10px; font-weight: 600;
    border-radius: 20px; letter-spacing: 0.3px;

    display: flex; align-items: center; gap: 8px;

    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px;
    background: rgba(26, 58, 42, 0.06); color: var(--forest);
    border-radius: 50%;

    background: var(--forest); color: var(--cream);
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(26, 58, 42, 0.15);

    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }

    desc: {
      en: "Monthly social meetup for vegans who love board games — a relaxed space to play, eat plant-based snacks, and make new friends.",
      pt: "Encontro social mensal para veganos que amam jogos de tabuleiro — um espaço descontraído para jogar, comer snacks veganos e fazer novas amizades."
    },
    tags: ["Meeting", "Social", "Games", "Monthly"],
    social: { facebook: "https://www.facebook.com/BrisbaneVeganBoardGames", meetup: "https://www.meetup.com/brisveganmeetup" }
  },
  {
    name: "Vegan Singles Brisbane and Surrounds",
    category: "Meeting",
    type: { en: "Social · Dating", pt: "Social · Relacionamentos" },
    initials: "VS",
    location: "Brisbane, QLD",
    desc: {
      en: "A Facebook group for vegan singles in Brisbane and surrounding areas looking to meet, connect, and maybe find a fellow plant-based partner.",
      pt: "Um grupo no Facebook para veganos solteiros em Brisbane e arredores que querem se conhecer, se conectar e talvez encontrar um parceiro ou parceira também vegano(a)."
    },
    tags: ["Dating", "Singles", "Social", "Community"],
    social: { facebook: "https://www.facebook.com/groups/1617569968532941" }
  }
];

// ── STATE ──
let currentFilter = 'all';
let currentLang = 'en';

// ── TAG TRANSLATIONS ──
const tagMap = {
  "Activism": "Ativismo", "Animal Rights": "Direitos Animais",
  "Community": "Comunidade", "Outreach": "Divulgação",
  "Vigils": "Vigílias", "Save Movement": "Save Movement",
  "Direct Action": "Ação Direta", "Guide": "Guia",
  "Directory": "Diretório", "Bilingual": "Bilíngue",
  "Resource": "Recurso", "Travel": "Viagem", "Reviews": "Avaliações",
  "Global": "Global", "Meeting": "Encontro", "Expo": "Expo",
  "Annual Event": "Evento Anual", "Food": "Comida",
  "Market": "Feira", "Sports": "Esportes", "Running": "Corrida",
  "Social": "Social", "Monthly": "Mensal", "Games": "Jogos",
  "University": "Universidade", "Students": "Estudantes",
  "Sanctuary": "Santuário", "Rescue": "Resgate", "Tours": "Tours",
  "Volunteering": "Voluntariado", "Open Days": "Dias Abertos",
  "Wildlife": "Vida Selvagem", "Conservation": "Conservação",
  "Education": "Educação", "Advocacy": "Advocacy",
  "Outdoors": "Ar Livre", "Hiking": "Trilhas",
  "Housing": "Moradia", "Share House": "Casa Compartilhada",
  "Meetup": "Encontros", "Facebook Group": "Grupo no Facebook",
  "Dating": "Namoro", "Singles": "Solteiros"
};

function translateTag(tag, lang) {
  if (lang === 'pt' && tagMap[tag]) return tagMap[tag];
  return tag;
}

// ── SOCIAL ICONS ──
const socialIconSvg = {
  site: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>',
  facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 2h-3a5 5 0 0 0-5 5v3H6v4h3v8h4v-8h3.2l.8-4H13V7a1 1 0 0 1 1-1h3z"/></svg>',
  meetup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'
};
const socialLabels = { site: 'Website', instagram: 'Instagram', facebook: 'Facebook', meetup: 'Meetup' };

function renderSocialBtns(g) {
  const order = ['site', 'instagram', 'facebook', 'meetup'];
  return order
    .filter(k => g.social && g.social[k])
    .map(k => `<a href="${g.social[k]}" target="_blank" rel="noopener" class="social-btn" title="${socialLabels[k]}" aria-label="${socialLabels[k]}">${socialIconSvg[k]}</a>`)
    .join('');
}

// ── RENDER ──
function renderCards() {
  let list = [...groups];

  if (currentFilter !== 'all') {
    list = list.filter(g => g.category === currentFilter);
  }

  list.sort((a, b) => a.name.localeCompare(b.name));

  const grid = document.getElementById('cardsGrid');
  const noRes = document.getElementById('noResults');
  const info = document.getElementById('resultsInfo');

  if (list.length === 0) {
    grid.innerHTML = '';
    noRes.style.display = 'block';
    info.textContent = '';
    return;
  }
  noRes.style.display = 'none';

  const groupsWord = currentLang === 'pt' ? 'grupos' : 'groups';
  const showingWord = currentLang === 'pt' ? 'Exibindo' : 'Showing';
  info.textContent = `${showingWord} ${list.length} ${groupsWord}`;
  document.getElementById('groupCount').textContent = list.length;

  const badgeMap = {
    Activism: 'badge-activism',
    Guide: 'badge-guide',
    Meeting: 'badge-meeting',
    Sanctuary: 'badge-sanctuary'
  };

  const categoryLabel = {
    en: { Activism: 'Activism', Guide: 'Guide', Meeting: 'Meeting', Sanctuary: 'Sanctuary' },
    pt: { Activism: 'Ativismo', Guide: 'Guia', Meeting: 'Encontro', Sanctuary: 'Santuário' }
  };

  grid.innerHTML = list.map((g, i) => `
    <div class="card" style="animation-delay:${i * 0.04}s">
      <div class="card-top">
        ${g.logo
          ? `<div class="card-logo"><img src="${g.logo}" alt="${g.name} logo" loading="lazy" onerror="this.parentNode.className='card-avatar';this.replaceWith('${g.initials}')"></div>`
          : `<div class="card-avatar">${g.initials}</div>`}
        <span class="card-category-badge ${badgeMap[g.category]}">${categoryLabel[currentLang][g.category]}</span>
      </div>
      <div class="card-type">${g.type[currentLang]}</div>
      <div class="card-name">${g.name}</div>
      <div class="card-location">📍 ${g.location}</div>
      <div class="card-desc">${g.desc[currentLang]}</div>
      <div class="card-tags">${g.tags.map(t => `<span class="tag">${translateTag(t, currentLang)}</span>`).join('')}</div>
      <div class="card-socials">${renderSocialBtns(g)}</div>
    </div>
  `).join('');
}

// ── FILTER ──
function setFilter(type) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.filter-btn[data-filter="${type}"]`).classList.add('active');
  renderCards();
}

// ── I18N ──
const i18n = {
  en: {
    "page.title": "Community",
    "page.tagline": "Groups and organisations creating change",
    "page.desc": "Groups, sanctuaries, communities, and organisations in Brisbane working towards a kinder, more compassionate world for animals and people.",
    "page.groups": "groups",
    "filters.label": "Sort & Filter",
    "filter.all": "A → Z",
    "no.title": "No groups found",
    "no.sub": "Try adjusting your filters",
    "footer.tagline": "A better world for the animals.",
    "footer.created": "Created by"
  },
  pt: {
    "page.title": "Comunidade",
    "page.tagline": "Grupos e organizações criando mudança",
    "page.desc": "Grupos, santuários, comunidades e organizações em Brisbane trabalhando por um mundo mais gentil e compassivo para animais e pessoas.",
    "page.groups": "grupos",
    "filters.label": "Ordenar & Filtrar",
    "filter.all": "A → Z",
    "no.title": "Nenhum grupo encontrado",
    "no.sub": "Tente ajustar os filtros",
    "footer.tagline": "Um mundo melhor para os animais.",
    "footer.created": "Criado por"
  }
};

function toggleLang() {
  currentLang = currentLang === "en" ? "pt" : "en";
  document.getElementById("langBtn").textContent = currentLang === "en" ? "PT" : "EN";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (i18n[currentLang][key]) el.textContent = i18n[currentLang][key];
  });
  renderCards();
}

// ── INIT ──
renderCards();
</script>
</body>
</html>
