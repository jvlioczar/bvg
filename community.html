<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groups — Brisbane Vegan Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="partials.js"></script>
<style>
  a, .tag, .card, .card-btn, .filter-btn {
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><g transform='translate(4,2) rotate(-45 12 14)'><path d='M12 0C6.5 0 2 4.5 2 10c0 7.5 10 18 10 18s10-10.5 10-18C22 4.5 17.5 0 12 0z' fill='%23d4a847' stroke='%231a3a2a' stroke-width='1'/></g></svg>") 26 26, pointer;
  }

  /* ── PAGE HEADER ── */
  .page-header {
    max-width: 1100px; margin: 0 auto;
    padding: 90px 40px 0;
  }
  .page-num {
    font-family: 'Fraunces', serif;
    font-size: 64px; font-weight: 700;
    color: rgba(45, 90, 61, 0.06); line-height: 1;
    margin-bottom: -10px;
  }
  .page-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 700; color: var(--forest);
    letter-spacing: -1.5px; margin-bottom: 4px;
  }
  .page-tagline {
    font-family: 'Boldonse', system-ui;
    font-size: 14px; font-weight: 400;
    color: var(--sage); letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .page-desc {
    font-size: 15px; line-height: 1.7;
    color: var(--text-light); max-width: 600px;
  }
  .page-count {
    margin-top: 10px;
    font-size: 13px; color: var(--sage); font-weight: 500;
  }
  .page-count span {
    font-family: 'Fraunces', serif; font-weight: 700;
    font-size: 15px; color: var(--forest);
  }

  /* ── FILTERS ── */
  .filters-bar {
    max-width: 1100px; margin: 24px auto 0;
    padding: 0 40px;
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .filters-label {
    font-size: 11px; font-weight: 600;
    color: var(--sage); letter-spacing: 0.8px;
    text-transform: uppercase; margin-right: 4px;
  }
  .filter-btn {
    padding: 7px 18px;
    border: 1.5px solid rgba(26, 58, 42, 0.12);
    border-radius: 24px;
    background: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 600;
    color: var(--text-light);
    transition: all 0.25s;
    white-space: nowrap;
  }
  .filter-btn:hover {
    border-color: var(--forest); color: var(--forest);
  }
  .filter-btn.active {
    background: var(--forest); color: var(--cream);
    border-color: var(--forest);
  }

  /* ── RESULTS ── */
  .results-info {
    max-width: 1100px; margin: 20px auto 0;
    padding: 0 40px;
    font-size: 12px; color: var(--sage);
  }

  /* ── CARDS ── */
  .cards-section {
    max-width: 1100px; margin: 16px auto 0;
    padding: 0 40px 60px;
  }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .card {
    background: white; border-radius: 14px;
    padding: 22px;
    border: 1px solid rgba(42, 42, 40, 0.06);
    transition: all 0.35s ease;
    position: relative; overflow: hidden;
    text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
    opacity: 0; transform: translateY(16px);
    animation: cardIn 0.4s ease both;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, var(--leaf), var(--gold));
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.4s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(26, 58, 42, 0.1);
    border-color: rgba(74, 140, 92, 0.15);
  }
  .card:hover::before { transform: scaleX(1); }

  .card-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 6px;
  }
  .card-emoji { font-size: 26px; }
  .card-category-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.4px; text-transform: uppercase;
  }
  .badge-activism { background: rgba(196, 113, 74, 0.1); color: var(--terracotta); }
  .badge-guide { background: rgba(58, 158, 143, 0.1); color: var(--teal); }
  .badge-meeting { background: rgba(212, 168, 71, 0.1); color: var(--bark); }
  .badge-sanctuary { background: rgba(139, 115, 85, 0.1); color: var(--bark); }

  .card-type {
    font-size: 10px; font-weight: 600;
    color: var(--terracotta);
    letter-spacing: 0.5px; text-transform: uppercase;
    margin-bottom: 2px;
  }
  .card-name {
    font-family: 'Fraunces', serif;
    font-size: 18px; font-weight: 700;
    color: var(--forest); margin-bottom: 2px;
  }
  .card-location {
    font-size: 12px; color: var(--sage); margin-bottom: 8px;
  }
  .card-desc {
    font-size: 13px; line-height: 1.6;
    color: var(--text-light); margin-bottom: 12px;
    flex-grow: 1;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .tag {
    padding: 3px 10px;
    background: rgba(74, 140, 92, 0.08);
    color: var(--moss);
    font-size: 10px; font-weight: 600;
    border-radius: 20px; letter-spacing: 0.3px;
  }
  .card-btn {
    display: inline-flex; align-items: center; justify-content: center;
    align-self: flex-start;
    padding: 6px 18px;
    background: var(--forest); color: var(--cream);
    border: 1.5px solid var(--forest);
    border-radius: 24px;
    font-size: 12px; font-weight: 600;
    text-decoration: none; letter-spacing: 0.3px;
    transition: all 0.3s ease;
  }
  .card-btn:hover {
    background: rgba(26, 58, 42, 0.08); color: var(--forest);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(26, 58, 42, 0.15);
  }

  /* ── NO RESULTS ── */
  .no-results {
    text-align: center; padding: 60px 20px; color: var(--sage);
  }
  .no-results-emoji { font-size: 48px; margin-bottom: 12px; }
  .no-results-text {
    font-family: 'Fraunces', serif;
    font-size: 20px; font-weight: 700; color: var(--forest);
    margin-bottom: 6px;
  }
  .no-results-sub { font-size: 14px; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 768px) {
    .page-header { padding: 80px 20px 0; }
    .filters-bar { padding: 0 20px; }
    .results-info { padding: 0 20px; }
    .cards-section { padding: 0 20px 40px; }
    .cards-grid { grid-template-columns: 1fr; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>

  <!-- NAV (shared header, see partials.js) -->
  <div id="site-header"></div>
  <script>document.getElementById('site-header').outerHTML = renderSiteHeader('community.html');</script>
  <div class="page-header">
    <div class="page-num">02</div>
    <h1 class="page-title" data-i18n="page.title">Community</h1>
    <p class="page-tagline" data-i18n="page.tagline">Groups and organisations creating change</p>
    <p class="page-desc" data-i18n="page.desc">Groups, sanctuaries, communities, and organisations in Brisbane working towards a kinder, more compassionate world for animals and people.</p>
    <div class="page-count"><span id="groupCount">13</span> <span data-i18n="page.groups">groups</span></div>
  </div>

  <!-- FILTERS -->
  <div class="filters-bar">
    <span class="filters-label" data-i18n="filters.label">Sort & Filter</span>
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')" data-i18n="filter.all">A → Z</button>
    <button class="filter-btn" data-filter="Activism" onclick="setFilter('Activism')">✊ Activism</button>
    <button class="filter-btn" data-filter="Guide" onclick="setFilter('Guide')">📖 Guide</button>
    <button class="filter-btn" data-filter="Meeting" onclick="setFilter('Meeting')">🤝 Meeting</button>
    <button class="filter-btn" data-filter="Sanctuary" onclick="setFilter('Sanctuary')">🐾 Sanctuary</button>
  </div>

  <!-- RESULTS -->
  <div class="results-info" id="resultsInfo"></div>

  <!-- CARDS -->
  <div class="cards-section">
    <div class="cards-grid" id="cardsGrid"></div>
    <div class="no-results" id="noResults" style="display:none;">
      <div class="no-results-emoji">🌱</div>
      <div class="no-results-text" data-i18n="no.title">No groups found</div>
      <div class="no-results-sub" data-i18n="no.sub">Try adjusting your filters</div>
    </div>
  </div>

  <!-- FOOTER (shared, see partials.js) -->
  <div id="site-footer"></div>
  <script>document.getElementById('site-footer').outerHTML = renderSiteFooter();</script>
<script>

      pt: "Um guia bilíngue completo para a vida vegana em Brisbane e região — restaurantes, grupos, pessoas e recursos em um só lugar."

    desc: {

      pt: "Encontro social mensal para veganos que amam jogos de tabuleiro — um espaço descontraído para jogar, comer snacks veganos e fazer novas amizades."
    },

      pt: "Um santuário amoroso para animais de fazenda resgatados — cabras, ovelhas, porcos, vacas e galinhas vivendo em paz, com dias abertos regulares."
    },
    tags: ["Sanctuary", "Rescue", "Open Days", "Volunteering"],
    url: "#"
  }
];

// ── STATE ──
let currentFilter = 'all';
let currentLang = 'en';

// ── TAG TRANSLATIONS ──
const tagMap = {
  "Activism": "Ativismo", "Animal Rights": "Direitos Animais",
  "Community": "Comunidade", "Outreach": "Divulgação",
  "Vigils": "Vigílias", "Save Movement": "Save Movement",
  "Direct Action": "Ação Direta", "Guide": "Guia",
  "Directory": "Diretório", "Bilingual": "Bilíngue",
  "Resource": "Recurso", "Travel": "Viagem", "Reviews": "Avaliações",
  "Global": "Global", "Meeting": "Encontro", "Expo": "Expo",
  "Annual Event": "Evento Anual", "Food": "Comida",
  "Market": "Feira", "Sports": "Esportes", "Running": "Corrida",
  "Social": "Social", "Monthly": "Mensal", "Games": "Jogos",
  "University": "Universidade", "Students": "Estudantes",
  "Sanctuary": "Santuário", "Rescue": "Resgate", "Tours": "Tours",
  "Volunteering": "Voluntariado", "Open Days": "Dias Abertos",
  "Wildlife": "Vida Selvagem", "Conservation": "Conservação",
  "Education": "Educação", "Advocacy": "Advocacy"
};

function translateTag(tag, lang) {
  if (lang === 'pt' && tagMap[tag]) return tagMap[tag];
  return tag;
}

// ── RENDER ──
function renderCards() {
  let list = [...groups];

  if (currentFilter !== 'all') {
    list = list.filter(g => g.category === currentFilter);
  }

  list.sort((a, b) => a.name.localeCompare(b.name));

  const grid = document.getElementById('cardsGrid');
  const noRes = document.getElementById('noResults');
  const info = document.getElementById('resultsInfo');

  if (list.length === 0) {
    grid.innerHTML = '';
    noRes.style.display = 'block';
    info.textContent = '';
    return;
  }
  noRes.style.display = 'none';

  const groupsWord = currentLang === 'pt' ? 'grupos' : 'groups';
  const showingWord = currentLang === 'pt' ? 'Exibindo' : 'Showing';
  info.textContent = `${showingWord} ${list.length} ${groupsWord}`;
  document.getElementById('groupCount').textContent = list.length;

  const badgeMap = {
    Activism: 'badge-activism',
    Guide: 'badge-guide',
    Meeting: 'badge-meeting',
    Sanctuary: 'badge-sanctuary'
  };

  const categoryLabel = {
    en: { Activism: 'Activism', Guide: 'Guide', Meeting: 'Meeting', Sanctuary: 'Sanctuary' },
    pt: { Activism: 'Ativismo', Guide: 'Guia', Meeting: 'Encontro', Sanctuary: 'Santuário' }
  };

  const btnLabel = currentLang === 'pt' ? 'Saiba mais' : 'Learn more';

  grid.innerHTML = list.map((g, i) => `
    <div class="card" style="animation-delay:${i * 0.04}s">
      <div class="card-top">
        <span class="card-emoji">${g.emoji}</span>
        <span class="card-category-badge ${badgeMap[g.category]}">${categoryLabel[currentLang][g.category]}</span>
      </div>
      <div class="card-type">${g.type[currentLang]}</div>
      <div class="card-name">${g.name}</div>
      <div class="card-location">📍 ${g.location}</div>
      <div class="card-desc">${g.desc[currentLang]}</div>
      <div class="card-tags">${g.tags.map(t => `<span class="tag">${translateTag(t, currentLang)}</span>`).join('')}</div>
      <a href="${g.url}" target="_blank" rel="noopener" class="card-btn">${btnLabel}</a>
    </div>
  `).join('');
}

// ── FILTER ──
function setFilter(type) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.filter-btn[data-filter="${type}"]`).classList.add('active');
  renderCards();
}

// ── I18N ──
const i18n = {
  en: {
    "page.title": "Community",
    "page.tagline": "Groups and organisations creating change",
    "page.desc": "Groups, sanctuaries, communities, and organisations in Brisbane working towards a kinder, more compassionate world for animals and people.",
    "page.groups": "groups",
    "filters.label": "Sort & Filter",
    "filter.all": "A → Z",
    "no.title": "No groups found",
    "no.sub": "Try adjusting your filters",
    "footer.tagline": "A better world for the animals.",
    "footer.created": "Created by"
  },
  pt: {
    "page.title": "Comunidade",
    "page.tagline": "Grupos e organizações criando mudança",
    "page.desc": "Grupos, santuários, comunidades e organizações em Brisbane trabalhando por um mundo mais gentil e compassivo para animais e pessoas.",
    "page.groups": "grupos",
    "filters.label": "Ordenar & Filtrar",
    "filter.all": "A → Z",
    "no.title": "Nenhum grupo encontrado",
    "no.sub": "Tente ajustar os filtros",
    "footer.tagline": "Um mundo melhor para os animais.",
    "footer.created": "Criado por"
  }
};

function toggleLang() {
  currentLang = currentLang === "en" ? "pt" : "en";
  document.getElementById("langBtn").textContent = currentLang === "en" ? "PT" : "EN";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (i18n[currentLang][key]) el.textContent = i18n[currentLang][key];
  });
  renderCards();
}

// ── INIT ──
renderCards();
</script>
</body>
</html>
