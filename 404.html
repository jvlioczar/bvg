<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/">
<title>Page not found | Brisbane Vegan Guide</title>
<meta name="description" content="This page could not be found. Head back to the Brisbane Vegan Guide to find vegan restaurants, cafes, groups and people.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#1a3a2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="icon" type="image/svg+xml" href="icon-bvg.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="partials.js"></script>
<style>
  .nf { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 24px 60px; }
  .nf-code { font-family: 'Fraunces', serif; font-size: clamp(72px, 16vw, 140px); font-weight: 700; color: rgba(45, 90, 61, 0.12); line-height: 1; }
  .nf h1 { font-family: 'Fraunces', serif; font-size: clamp(28px, 5vw, 42px); font-weight: 700; color: var(--forest); letter-spacing: -1px; margin: 4px 0 10px; }
  .nf p { font-size: 15px; line-height: 1.7; color: var(--text-light); max-width: 460px; margin-bottom: 26px; }
  .nf-links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .nf-links a { text-decoration: none; font-size: 13px; font-weight: 600; color: var(--forest); padding: 9px 20px; border-radius: 24px; background: rgba(26, 58, 42, 0.07); transition: all 0.25s; }
  .nf-links a:hover { background: var(--forest); color: var(--cream); }
  .nf-links a.primary { background: var(--forest); color: var(--cream); }
  .nf-links a.primary:hover { background: var(--moss); }
</style>
</head>
<body>

  <div id="site-header"></div>
  <script>document.getElementById('site-header').outerHTML = renderSiteHeader('');</script>

  <main class="nf" id="main-content">
    <div class="nf-code">404</div>
    <h1 data-i18n="nf.title">Page not found</h1>
    <p data-i18n="nf.text">The page you were looking for doesn't exist or has moved. Try one of these instead:</p>
    <div class="nf-links">
      <a class="primary" href="index.html" data-i18n="nf.home">Back to home</a>
      <a href="food.html" data-i18n="nf.food">Eat &amp; Drink</a>
      <a href="community.html" data-i18n="nf.community">Community</a>
      <a href="vegan-finder.html" data-i18n="nf.finder">Vegan Finder</a>
    </div>
  </main>

  <div id="site-footer"></div>
  <script>document.getElementById('site-footer').outerHTML = renderSiteFooter();</script>

<script>
const i18n = {
  en: {
    "nf.title": "Page not found",
    "nf.text": "The page you were looking for doesn't exist or has moved. Try one of these instead:",
    "nf.home": "Back to home",
    "nf.food": "Eat & Drink",
    "nf.community": "Community",
    "nf.finder": "Vegan Finder",
    "footer.tagline": "A better world for the animals.",
    "footer.created": "Created by"
  },
  pt: {
    "nf.title": "Página não encontrada",
    "nf.text": "A página que você procurava não existe ou foi movida. Tente um destes links:",
    "nf.home": "Voltar para o início",
    "nf.food": "Coma & Beba",
    "nf.community": "Comunidade",
    "nf.finder": "Buscador Vegano",
    "footer.tagline": "Um mundo melhor para os animais.",
    "footer.created": "Criado por"
  }
};
let currentLang = "en";
function toggleLang() {
  currentLang = currentLang === "en" ? "pt" : "en";
  document.getElementById("langBtn").textContent = currentLang === "en" ? "PT" : "EN";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (i18n[currentLang][key]) el.textContent = i18n[currentLang][key];
  });
}
</script>
</body>
</html>
